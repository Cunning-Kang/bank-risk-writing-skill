# Public Sample Metadata Template
# 每个公开样本入库时必须填写此模板，保存为同名 .meta.yaml 文件
# 例如：2025-nfra-policy-capital-management.meta.yaml

# 样本标题（简明描述材料内容）
title: ""

# 样本来源类型（必填，只能选一项）
# 可选值：policy | annual-report | quarterly-report | research | ppt | briefing | rewrite-case | other
source_type: ""

# 来源机构或平台名称（必填）
# 例如：国家金融监督管理总局、某银行年报、某券商研究报告
source_name: ""

# 是否确认为公开材料（必填，必须为 true 才能入库）
public_confirmed: false

# 收集原因（必填，至少选一项）
# 可选值：style-sample | structure-sample | ppt-sample | test-sample | rewrite-reference | negative-sample
collection_reason: []
  # - style-sample        # 用于学习正式表达风格
  # - structure-sample    # 用于学习文档结构框架
  # - ppt-sample          # 用于学习PPT页级逻辑
  # - test-sample         # 用于测试用例输入
  # - rewrite-reference   # 用于改写对照参考
  # - negative-sample     # 作为反面示例（提醒模型避免）

# 样本质量评分（必填，1-5 分）
# 5=极优 4=良好 3=可用 2=有问题 1=不建议入库（除非作负样本）
# 注意：quality_score 仅衡量该样本对本项目 skill 的用途价值（结构、风格、信息密度），
# 不代表监管权威性、事实准确性外推，或对来源材料以外的适用性。
quality_score: 0

# 风险标记（有则列出，无则写 [none]）
# 可选值：promotional-tone | low-density | ocr-issues | unclear-structure | over-confident-conclusion | none
risk_flags:
  - none

# 标签（自由填写，用于检索和分类）
tags: []
  # - policy
  # - formal-style
  # - risk-analysis
  # - capital-management
  # - annual-report
  # - governance

# 适用于哪些 skill（至少选一项）
# 可选值：policy-brief | formal-polish | report-outline | ppt-outline | all
usable_for: []
  # - policy-brief
  # - formal-polish
  # - report-outline
  # - ppt-outline

# 样本使用建议（建议填写）
# 用 1-3 条短句说明该样本最适合支持哪些任务输出
recommended_uses: []
  # - 用于 policy-brief 的条款提炼测试
  # - 用于 report-outline 的结构学习
  # - 用于 ppt-outline 的观点化标题参考

# 不适用提醒（建议填写）
# 说明不应从该样本学什么，避免模型误学风格或结论强度
not_suitable_for: []
  # - 不适合学习结论强度
  # - 不适合直接当作政策依据引用
  # - 不适合学习PPT文字密度

# 备注（必填）
# 必须说明：适合学什么、不适合学什么、引用时应注意什么
notes: >
  在此填写样本的适用场景、学习价值和注意事项。
  必须说明：适合学什么、不适合学什么。

# ── 来源溯源字段（建议填写；如样本用于测试则必填） ──────────

# 原始来源 URL 或获取渠道说明（建议填写；test-ready 样本必填）
# 如果没有可用的公开 URL，须在 provenance_note 中说明获取方式
# 例如：https://www.gov.cn/zhengce/zhengceku/...
source_url: ""

# 获取或访问日期（建议填写，格式：YYYY-MM-DD）
access_date: ""

# 来源版本或文件日期（建议填写）
# 用于政策文本的发布日期或版本号，年报的报告年度等
# 例如：2006年修正版 / 2024年度 / 2025年4月发布
source_version: ""

# 文件日期（选填，与 source_version 二选一）
# 当 source_version 不适用时，可用 document_date 记录具体日期
# 格式：YYYY-MM-DD 或自然语言日期，例如：2025-04-28
document_date: ""

# 归档说明（选填）
# 如果原始链接可能失效，记录替代归档方式
# 例如：已保存本地副本 / 仅纸质版本 / 来源网站可长期访问
archive_note: ""

# 引用边界（必填）
# 明确说明该样本在引用时的限制——不可超出来源材料范围使用
citation_boundary: >
  在此填写引用限制。例如：
  本样本仅作为公开材料的结构/风格参考，不得作为监管依据引用。
  引用任何数据或判断前须核对原始出处。

# 是否可直接引用原文（必填）
# true 表示原始材料允许逐字引用；false 表示仅供结构或风格参考
can_quote_directly: false

# 溯源补充说明（选填，无 source_url 时建议填写）
# 当 source_url 无法提供时，须在此说明获取渠道与可信度判断依据
provenance_note: ""

# ── 测试关联 ──────────────────────────────────────────────

# 是否已用于测试集（test-ready 样本需要完整 provenance 字段）
used_in_tests: false

# 关联测试用例编号（仅当 used_in_tests 为 true 时填写）
linked_test_cases: []
  # - case-01
  # - case-10
