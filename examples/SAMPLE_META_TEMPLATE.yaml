# Public Sample Metadata Template
# 每个公开样本入库时必须填写此模板，保存为同名 .meta.yaml 文件
# 例如：2025-nfra-policy-capital-management.meta.yaml

# 样本标题（简明描述材料内容）
title: ""

# 样本来源类型（必填，只能选一项）
# 可选值：policy | annual-report | quarterly-report | research | ppt | briefing | rewrite-case | other
source_type: ""

# 来源机构或平台名称（必填）
# 例如：国家金融监督管理总局、某银行年报、某券商研究报告
source_name: ""

# 是否确认为公开材料（必填，必须为 true 才能入库）
public_confirmed: false

# 收集原因（必填，至少选一项）
# 可选值：style-sample | structure-sample | ppt-sample | test-sample | rewrite-reference | negative-sample
collection_reason: []
  # - style-sample        # 用于学习正式表达风格
  # - structure-sample    # 用于学习文档结构框架
  # - ppt-sample          # 用于学习PPT页级逻辑
  # - test-sample         # 用于测试用例输入
  # - rewrite-reference   # 用于改写对照参考
  # - negative-sample     # 作为反面示例（提醒模型避免）

# 样本质量评分（必填，1-5 分）
# 5=极优 4=良好 3=可用 2=有问题 1=不建议入库（除非作负样本）
quality_score: 0

# 风险标记（有则列出，无则写 [none]）
# 可选值：promotional-tone | low-density | ocr-issues | unclear-structure | over-confident-conclusion | none
risk_flags:
  - none

# 标签（自由填写，用于检索和分类）
tags: []
  # - policy
  # - formal-style
  # - risk-analysis
  # - capital-management
  # - annual-report
  # - governance

# 适用于哪些 skill（至少选一项）
# 可选值：policy-brief | formal-polish | report-outline | ppt-outline | all
usable_for: []
  # - policy-brief
  # - formal-polish
  # - report-outline
  # - ppt-outline

# 样本使用建议（建议填写）
# 用 1-3 条短句说明该样本最适合支持哪些任务输出
recommended_uses: []
  # - 用于 policy-brief 的条款提炼测试
  # - 用于 report-outline 的结构学习
  # - 用于 ppt-outline 的观点化标题参考

# 不适用提醒（建议填写）
# 说明不应从该样本学什么，避免模型误学风格或结论强度
not_suitable_for: []
  # - 不适合学习结论强度
  # - 不适合直接当作政策依据引用
  # - 不适合学习PPT文字密度

# 备注（必填）
# 必须说明：适合学什么、不适合学什么、引用时应注意什么
notes: >
  在此填写样本的适用场景、学习价值和注意事项。
  必须说明：适合学什么、不适合学什么。

# 可选：是否已用于测试集
used_in_tests: false

# 可选：关联测试用例编号
linked_test_cases: []
  # - case-01
  # - case-10
