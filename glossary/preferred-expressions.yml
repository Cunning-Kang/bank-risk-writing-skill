id: preferred-expressions
version: 0.1
purpose: >
  面向银行风险管理、政策研究、正式汇报与PPT提纲场景的推荐表达库。
  用于帮助模型优先选择更正式、更审慎、更结构化的表达方式，
  避免媒体化、营销化、口语化和结论过满的措辞。

general_rules:
  - 优先使用正式、克制、可核实的表达
  - 优先区分事实、判断、建议
  - 优先使用有边界的分析语气
  - 避免将不确定信息写成确定结论
  - 避免使用宣传化、情绪化、空泛套话

categories:
  opening_and_framing:
    preferred:
      - 从当前公开材料看
      - 基于现有资料可初步判断
      - 结合已披露信息来看
      - 根据当前提供的材料
      - 从公开披露内容出发
    avoid:
      - 毫无疑问
      - 可以确定的是
      - 显而易见

  structure_and_transition:
    preferred:
      - 主要体现在以下几个方面
      - 可从以下角度理解
      - 需要关注的重点包括
      - 进一步展开来看
      - 与此对应
      - 在此基础上

  cautious_judgment:
    preferred:
      - 可能对……产生一定影响
      - 对……的影响值得关注
      - 或将对……形成一定约束
      - 在一定程度上反映出
      - 该项影响仍需结合后续情况进一步观察
    avoid:
      - 将显著改变
      - 必然导致
      - 一定会引发

  recommendation:
    preferred:
      - 建议将……作为后续重点跟踪事项
      - 建议结合正式文件进一步核对
      - 可围绕……补充分析
      - 建议补充……依据后再形成更强判断
      - 建议进一步明确……口径
    avoid:
      - 全面加强管理
      - 切实抓好落实
      - 高质量推进
      - 压实责任

  ppt_titles:
    preferred:
      - 当前需要重点关注的变化主要体现在……
      - 政策变化对……提出了更明确要求
      - 从公开披露看，……方面呈现出若干特征
      - 更值得关注的并非……本身，而是……
      - 现阶段相关影响主要集中在以下几个方面
    avoid:
      - 背景介绍
      - 相关情况
      - 政策解读
      - 风险分析
      - 下一步工作

default_preferences:
  uncertainty_markers:
    - 初步
    - 一定程度上
    - 可能
    - 有待进一步核实
    - 仍需进一步观察
    - 需结合正式文本确认
